
name: Build DON'T BLINK Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Verify Godot installation
        run: godot --version

      - name: Import Godot project
        run: godot --headless --editor --path . --quit

      - name: Check Android export preset
        shell: bash
        run: |
          if [ ! -f export_presets.cfg ]; then
            echo "::error::Missing export_presets.cfg."
            echo "Create an Android export preset in Godot Editor and commit it."
            exit 1
          fi

          if ! grep -q 'name="Android"' export_presets.cfg; then
            echo "::error::The export preset must be named Android."
            exit 1
          fi

      - name: Build debug APK
        run: |
          mkdir -p build
          godot --headless --path . \
            --export-debug "Android" \
            build/DONT_BLINK.apk

      - name: Verify APK
        run: |
          test -s build/DONT_BLINK.apk
          ls -lh build/DONT_BLINK.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dont-blink-android-apk
          path: build/DONT_BLINK.apk
          if-no-files-found: error
          retention-days: 14
